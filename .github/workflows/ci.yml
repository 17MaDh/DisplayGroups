name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/settings/package-lock.json
      - name: Settings UI (type-check and build; Tauri embeds apps/settings/dist)
        working-directory: apps/settings
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The GNOME backend, the command line, the agent and the settings app on Linux
  # (ARCHITECTURE.md §16), as scripts/build-linux.sh checks them.
  linux:
    name: Linux (GNOME)
    runs-on: ubuntu-24.04
    env:
      PACKAGES: -p dg-model -p dg-identity -p dg-hotkey -p dg-engine -p dg-gnome -p displaygroups -p displaygroups-settings
    steps:
      - uses: actions/checkout@v7
      - name: WebKitGTK for the settings app
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/settings/package-lock.json
      - name: Settings UI (type-check and build; Tauri embeds apps/settings/dist)
        working-directory: apps/settings
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked $PACKAGES --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked $PACKAGES
