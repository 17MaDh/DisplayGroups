name: Release

# Pushing a tag such as v1.0.0 builds, tests and (when SignPath is set up) signs a
# release, then creates a *draft* GitHub release with the Windows installer, the portable
# ZIP, the Linux command-line package and SHA256SUMS.txt. A maintainer reviews the draft
# and publishes it by hand. Versions below 1.0 and tags with a suffix (v1.1.0-rc.1) are
# marked as pre-releases.
#
# Signing is optional. It is on when the repository variable SIGNPATH_ORGANIZATION_ID
# is set; docs/releasing.md lists the other variables, the secret and the SignPath
# artifact configurations. Without it the release is unsigned and the draft says so.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Linux command line and agent for GNOME (ARCHITECTURE.md §16), checked, tested and
  # packed by scripts/build-linux.sh.
  linux:
    name: Build the Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "The tag says $GITHUB_REF_NAME but Cargo.toml says $version." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check, test and package
        run: bash scripts/build-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-package
          path: dist-release/*-linux-x64-cli.tar.gz
          if-no-files-found: error

  release:
    name: Build, sign and draft the release
    needs: linux
    # GitHub-hosted, as SignPath's open-source signing requires for every job that
    # leads to a signing request.
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
      actions: read # SignPath downloads the uploaded workflow artifacts
    env:
      SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/settings/package-lock.json

      # No Rust build cache in release builds: everything is built from the tagged source.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test and build the executables
        run: ./scripts/build.ps1 -Stage Binaries -Version $env:GITHUB_REF_NAME

      # ---- Unsigned release ---------------------------------------------------------

      - name: Package (unsigned)
        if: env.SIGNPATH != 'true'
        run: ./scripts/build.ps1 -Stage Package -Version $env:GITHUB_REF_NAME

      # ---- Signed release (SignPath) ------------------------------------------------
      # A signing request is a workflow step, so the release is packaged in rounds
      # (docs/releasing.md). Each Package run swaps every file that already has a signed
      # copy and queues the rest:
      #   round 1  the executables, the NSIS plugin DLLs and an uninstaller
      #   round 2  the uninstaller again: it embeds the plugins, now signed
      #   round 3  nothing may be left but the installer, which is signed last.

      - name: Signing folder
        if: env.SIGNPATH == 'true'
        run: |
          "DG_SIGN_MODE=signpath" >> $env:GITHUB_ENV
          "DG_SIGN_DIR=$env:RUNNER_TEMP\dg-sign" >> $env:GITHUB_ENV

      - name: Package, round 1
        if: env.SIGNPATH == 'true'
        id: round1
        run: ./scripts/build.ps1 -Stage Package -Version $env:GITHUB_REF_NAME

      - name: Upload the round 1 files
        if: env.SIGNPATH == 'true' && steps.round1.outputs.pending != '0'
        id: upload1
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-round1
          path: ${{ env.DG_SIGN_DIR }}/unsigned/
          if-no-files-found: error

      - name: Sign the round 1 files
        if: env.SIGNPATH == 'true' && steps.round1.outputs.pending != '0'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_FILES_CONFIGURATION }}
          github-artifact-id: ${{ steps.upload1.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ env.DG_SIGN_DIR }}/signed/round1

      - name: Package, round 2
        if: env.SIGNPATH == 'true'
        id: round2
        run: ./scripts/build.ps1 -Stage Package -Version $env:GITHUB_REF_NAME

      - name: Upload the round 2 files
        if: env.SIGNPATH == 'true' && steps.round2.outputs.pending != '0'
        id: upload2
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-round2
          path: ${{ env.DG_SIGN_DIR }}/unsigned/
          if-no-files-found: error

      - name: Sign the round 2 files
        if: env.SIGNPATH == 'true' && steps.round2.outputs.pending != '0'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_FILES_CONFIGURATION }}
          github-artifact-id: ${{ steps.upload2.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ env.DG_SIGN_DIR }}/signed/round2

      - name: Package, round 3
        if: env.SIGNPATH == 'true'
        id: round3
        run: |
          ./scripts/build.ps1 -Stage Package -Version $env:GITHUB_REF_NAME
          if ((Get-Content $env:GITHUB_OUTPUT | Select-Object -Last 1) -ne 'pending=0') {
            throw 'Files are still unsigned after two signing rounds; see the list above.'
          }

      - name: Upload the installer
        if: env.SIGNPATH == 'true'
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: dist-release/*-setup-x64.exe
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ env.DG_SIGN_DIR }}/installer

      - name: Use the signed installer and check every signature
        if: env.SIGNPATH == 'true'
        run: |
          Copy-Item "$env:DG_SIGN_DIR/installer/*-setup-x64.exe" dist-release/ -Force
          ./scripts/build.ps1 -Stage Checksums

          $check = Join-Path $env:RUNNER_TEMP 'dg-check'
          Get-ChildItem dist-release -Filter *.zip | ForEach-Object {
            Expand-Archive $_.FullName -DestinationPath (Join-Path $check 'zip') -Force
          }
          # 7-Zip, preinstalled on the runner, unpacks NSIS installers.
          Get-ChildItem dist-release -Filter *-setup-x64.exe | ForEach-Object {
            7z x $_.FullName "-o$(Join-Path $check 'installer')" -y | Out-Null
          }
          $files = @(Get-ChildItem dist-release -Filter *.exe) +
                   @(Get-ChildItem $check -Recurse -Include *.exe, *.dll)
          $files | ForEach-Object { '{0,-10} {1}' -f (Get-AuthenticodeSignature $_.FullName).Status, $_.FullName }
          $bad = @($files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
          if ($bad) { throw "Not signed: $($bad.Name -join ', ')" }

      # ---- The Linux package ----------------------------------------------------------

      - name: Add the Linux package
        uses: actions/download-artifact@v8
        with:
          name: linux-package
          path: dist-release

      - name: Checksums for every download
        run: ./scripts/build.ps1 -Stage Checksums -Version $env:GITHUB_REF_NAME

      # ---- Draft release ------------------------------------------------------------

      - name: Release notes
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $signed = if ($env:SIGNPATH -eq 'true') {
            'The installer and executables are signed. Free code signing provided by SignPath.io, certificate by SignPath Foundation.'
          } else {
            'The Windows build is **not code-signed**. Windows SmartScreen will warn, and on PCs with Smart App Control turned on it will not run. See "Smart App Control and SmartScreen" in the README.'
          }
          @"
          ## Downloads

          | | File |
          |---|---|
          | **Windows 10 and 11**, installer | ``DisplayGroups-$v-setup-x64.exe`` |
          | **Windows 10 and 11**, portable | ``DisplayGroups-$v-portable-x64.zip`` |
          | **Linux** (preview), GNOME on Ubuntu 24.04 or later | ``DisplayGroups-$v-linux-x64-cli.tar.gz`` |

          $signed

          The Linux package has the command line and the agent: the tray icon, hotkeys as GNOME shortcuts, automatic switching and notifications. The settings app for Linux is not in it yet. See "Linux (preview)" in the README.

          ## Check a download

          Compare it with ``SHA256SUMS.txt``.

          ``````powershell
          (Get-FileHash .\DisplayGroups-$v-setup-x64.exe -Algorithm SHA256).Hash
          ``````

          ``````bash
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ``````
          "@ | Set-Content -Encoding utf8 release-notes.md

      - name: Create the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          name: DisplayGroups ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/*-setup-x64.exe
            dist-release/*-portable-x64.zip
            dist-release/*-linux-x64-cli.tar.gz
            dist-release/SHA256SUMS.txt
