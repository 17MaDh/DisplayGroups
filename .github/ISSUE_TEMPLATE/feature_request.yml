name: Feature request
description: Suggest something DisplayGroups could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Rough ideas are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead now?
      description: Other tools or workarounds you use, if any.
