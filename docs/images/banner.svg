<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="title desc">
  <title id="title">DisplayGroups</title>
  <desc id="desc">Two desk monitors, the "Desktop" group, switch to a living-room TV, the "Gaming on Couch" group, and back with one hotkey.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#18213f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="300" rx="20" fill="url(#bg)"/>

  <g transform="translate(15 0)" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <!-- Desktop: a large and a small monitor -->
    <rect x="95" y="70" width="170" height="104" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="103" y="78" width="154" height="88" rx="4" fill="url(#blue)"/>
    <rect x="171" y="174" width="18" height="16" fill="#334155"/>
    <rect x="150" y="190" width="60" height="6" rx="3" fill="#334155"/>
    <circle cx="180" cy="122" r="17" fill="#0b1222" fill-opacity="0.35"/>
    <text x="180" y="129" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1</text>

    <rect x="277" y="104" width="112" height="70" rx="7" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="284" y="111" width="98" height="56" rx="3" fill="url(#teal)"/>
    <rect x="324" y="174" width="16" height="16" fill="#334155"/>
    <rect x="310" y="190" width="44" height="6" rx="3" fill="#334155"/>
    <circle cx="333" cy="139" r="14" fill="#0b1222" fill-opacity="0.35"/>
    <text x="333" y="145" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>

    <text x="242" y="234" text-anchor="middle" font-size="22" font-weight="600" fill="#f8fafc">Desktop</text>
    <text x="242" y="258" text-anchor="middle" font-size="14" fill="#94a3b8">two monitors at the desk</text>

    <!-- The switch -->
    <line x1="436" y1="112" x2="514" y2="112" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#head)"/>
    <line x1="436" y1="140" x2="514" y2="140" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-start="url(#head)"/>
    <rect x="413" y="166" width="124" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="413" y="196" width="124" height="6" rx="3" fill="#0f172a" fill-opacity="0.5"/>
    <text x="475" y="189" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0" font-family="Cascadia Code, SFMono-Regular, Consolas, Menlo, monospace">Ctrl+Alt+F12</text>
    <text x="475" y="234" text-anchor="middle" font-size="13" fill="#94a3b8">hotkey · tray · shortcut</text>
    <text x="475" y="254" text-anchor="middle" font-size="13" fill="#94a3b8">or when a game starts</text>

    <!-- Gaming on Couch: the TV -->
    <rect x="605" y="58" width="230" height="134" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="613" y="66" width="214" height="118" rx="4" fill="url(#warm)"/>
    <rect x="640" y="192" width="8" height="10" rx="2" fill="#334155"/>
    <rect x="792" y="192" width="8" height="10" rx="2" fill="#334155"/>
    <circle cx="720" cy="125" r="20" fill="#0b1222" fill-opacity="0.35"/>
    <text x="720" y="133" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text>

    <text x="720" y="234" text-anchor="middle" font-size="22" font-weight="600" fill="#f8fafc">Gaming on Couch</text>
    <text x="720" y="258" text-anchor="middle" font-size="14" fill="#94a3b8">the living-room TV only</text>
  </g>
</svg>
